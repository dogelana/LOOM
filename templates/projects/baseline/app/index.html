<!doctype html>
<!-- @loom-file release=0.15.71 revision=78 policy=package-priority -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>LOOM Project</title><link rel="stylesheet" href="../../../engine/loom-design.css?v=0.15.71"><link id="loom-project-favicon" rel="icon" href="../../../assets/loom-logo.png?v=0.15.71">
<style>

:root{--green:#168346;--ink:#132018;--muted:#6b7b70;--line:#d9e6dc;--glass:rgba(255,255,255,.82)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui;color:var(--ink);
  background:
    radial-gradient(circle at 15% -12%,rgba(169,223,79,.20),transparent 30%),
    radial-gradient(circle at 88% 2%,rgba(39,158,56,.12),transparent 28%),
    linear-gradient(180deg,#f7faf7 0,#eef5ef 100%);
}
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
.bar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:11px 16px;border-bottom:1px solid rgba(201,218,205,.82);
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(249,252,250,.86));
  backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);
  position:sticky;top:0;z-index:100;
  box-shadow:0 10px 34px rgba(23,65,34,.06),inset 0 1px rgba(255,255,255,.95)
}
.project-shell-brand{display:flex;align-items:center;gap:12px;min-width:0}
.project-shell-mark{
  width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;padding:3px;
  border:1px solid rgba(203,220,207,.8);border-radius:14px;background:rgba(255,255,255,.78);
  box-shadow:0 7px 20px rgba(22,74,38,.07)
}
.project-shell-mark img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.brand{font-weight:950;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.shell-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.public-zone{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.public-zone>a{justify-content:center;
  min-height:36px;display:inline-flex;align-items:center;font-size:11px;font-weight:900;
  padding:8px 11px;border-radius:11px;border:1px solid #d5e4d8;
  background:linear-gradient(180deg,#fff,#f6faf7);color:#244d31;text-decoration:none;
  box-shadow:0 4px 15px rgba(22,74,38,.045);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease
}
.public-zone>a:hover{transform:translateY(-1px);border-color:#bcd7c3;box-shadow:0 8px 20px rgba(22,74,38,.08)}
.loom-home-button{gap:7px;line-height:1;text-align:center}.loom-home-icon{width:16px;height:16px;display:inline-grid;place-items:center;font-size:16px;line-height:1;flex:0 0 16px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.admin-zone{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:5px 7px 5px 9px;
  border:1px solid #e4d7a6;border-radius:14px;background:linear-gradient(145deg,#fffaf0,#fffdf8);
  box-shadow:0 5px 16px rgba(112,84,5,.05)
}
.admin-zone[hidden]{display:none}
.admin-label{font-size:8px;letter-spacing:.12em;font-weight:950;color:#7b5d08}
.links{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.links a{
  font-size:10px;font-weight:900;padding:8px 9px;border-radius:10px;border:1px solid #ddcf98;
  background:#fff;color:#654e0a;text-decoration:none
}
.stage{
  --loom-project-content-max:1320px;--loom-project-stage-inline-total:36px;
  display:block;padding:44px 18px 76px;position:relative;width:100%;container-type:inline-size
}
#feature-stage{
  width:min(var(--loom-project-content-max),100%);margin:0 auto;display:flex;flex-direction:column;align-items:stretch;
  justify-content:flex-start;gap:26px;position:relative;min-height:360px
}
/* Normal modules stay in the comfortable content lane. Modules that explicitly
   request page scope may break out to the full usable project-page width. */
#feature-stage>[data-loom-width-scope="page"]{
  width:calc(100vw - var(--loom-project-stage-inline-total))!important;
  max-width:calc(100vw - var(--loom-project-stage-inline-total))!important;
  align-self:center!important
}
@supports(width:100cqw){
  #feature-stage>[data-loom-width-scope="page"]{width:100cqw!important;max-width:100cqw!important}
}
.waiting{
  order:999;text-align:center;font-size:10px;color:#819087;letter-spacing:.09em;text-transform:uppercase;
  padding:18px 20px;border:1px dashed rgba(170,195,177,.75);border-radius:18px;background:rgba(255,255,255,.5)
}
.waiting.modules-loaded{display:none}
#loom-footer-root{width:100%;padding:0 18px 28px;display:flex;flex-direction:column;align-items:stretch}
@media(max-width:720px){
  .bar{align-items:flex-start;flex-wrap:wrap;padding:9px 10px}.project-shell-brand{flex:1 1 180px;max-width:100%}.project-shell-mark{width:38px;height:38px;flex-basis:38px;border-radius:12px}
  .brand,.meta{max-width:min(64vw,420px)}.shell-actions{width:100%;flex:1 1 100%;gap:5px;justify-content:flex-start}.public-zone{max-width:100%}.admin-zone{max-width:100%;padding:4px;justify-content:flex-start}.admin-label{display:none}
  .links{gap:4px;justify-content:flex-start}.links a,.public-zone .loom-global-control{justify-content:center;padding:7px 8px;font-size:10px;min-height:36px}
  .stage{--loom-project-stage-inline-total:20px;padding:24px 10px 54px}#feature-stage{gap:17px;min-width:0}#loom-footer-root{padding:0 10px 18px;min-width:0}
}
@media(max-width:420px){
  .bar{gap:8px}.project-shell-brand{flex-basis:100%}.brand,.meta{max-width:calc(100vw - 72px)}.shell-actions,.public-zone{width:100%}.public-zone .loom-global-control{flex:1 1 auto}.stage{--loom-project-stage-inline-total:16px;padding-left:8px;padding-right:8px}#loom-footer-root{padding-left:8px;padding-right:8px}
}


/* 0.15.71 production project-shell defaults */
body.loom-project-page{background:radial-gradient(circle at 14% -10%,rgba(169,223,79,.15),transparent 30%),radial-gradient(circle at 90% 0,rgba(39,158,56,.08),transparent 26%),linear-gradient(180deg,#f8fbf8,#eef5f0)}
.loom-project-page .bar{min-height:68px;padding:11px clamp(12px,2vw,22px);border-color:rgba(51,103,65,.12);box-shadow:0 8px 28px rgba(18,54,29,.045),inset 0 1px rgba(255,255,255,.95)}
.loom-project-page .project-shell-mark{border-radius:13px;border-color:rgba(51,103,65,.11);box-shadow:0 5px 16px rgba(18,54,29,.05)}
.loom-project-page .brand{font-size:14px}.loom-project-page .meta{font-size:10px}
.loom-project-page .stage{padding-top:36px}.loom-project-page #feature-stage{gap:22px}
.loom-project-page .waiting{min-height:86px;display:grid;place-items:center;border-color:rgba(51,103,65,.17);background:rgba(255,255,255,.62);box-shadow:inset 0 1px rgba(255,255,255,.9)}
@media(max-width:720px){.loom-project-page .stage{padding-top:22px}.loom-project-page #feature-stage{gap:16px}}

</style>
</head>
<body class="loom-project-page">
<div class="shell">
<header class="bar">
  <div class="project-shell-brand">
    <div id="projectShellMark" class="project-shell-mark" aria-label="Project logo"></div>
    <div><div class="brand" data-loom-project-name>Project</div><div class="meta" data-loom-project-tagline hidden></div></div>
  </div>
  <div class="shell-actions">
    <div id="loomProjectUserControls" class="public-zone" aria-label="LOOM user controls"></div>
    <div id="adminTools" hidden aria-label="LOOM Administrator tools"></div>
  </div>
</header>
<main class="stage"><div id="feature-stage"><div id="waitingMessage" class="waiting">Loading project modules…</div><footer id="loom-footer-root" data-loom-region="footer-root" data-loom-position-proxy="module" aria-label="Project footer"></footer></div></main>
</div>
<script src="../../../engine/deployment-guard.js?v=0.15.71"></script><script src="../../../engine/config.js?v=0.15.71"></script>
<script src="../../../engine/loom-brand.js?v=0.15.71"></script>
<script src="../../../engine/loom-toast.js?v=0.15.71"></script>
<script src="../../../engine/identity.js?v=0.15.71"></script>
<script src="../../../engine/identity-entry.js?v=0.15.71"></script>
<script src="../../../engine/interaction-capture.js?v=0.15.71"></script>
<script src="../../../engine/event-bus.js?v=0.15.71"></script>
<script src="../../../engine/registry-client.js?v=0.15.71"></script>
<script src="../../../engine/share-referrals.js?v=0.15.71"></script>
<script src="../../../engine/action-runtime.js?v=0.15.71"></script>
<script src="../../../engine/loom-shell.js?v=0.15.71"></script>
<script>
(async()=>{
  await window.LoomIdentityEntry?.ensure?.();
  const mountContext=window.LOOM_MOUNT_CONTEXT||{};
  const project=(()=>{
    const fromMount=String(mountContext.project||'').toLowerCase().replace(/[^a-z0-9_-]/g,'');
    if(fromMount)return fromMount;
    const fromQuery=new URLSearchParams(location.search).get('project');
    if(fromQuery)return String(fromQuery).toLowerCase().replace(/[^a-z0-9_-]/g,'');
    const parts=location.pathname.split('/').filter(Boolean);
    const projectsIndex=parts.lastIndexOf('projects');
    if(projectsIndex>=0&&parts[projectsIndex+1])return String(parts[projectsIndex+1]).toLowerCase().replace(/[^a-z0-9_-]/g,'');
    return '';
  })();
  const adminTools=document.getElementById('adminTools');
  let globalShellSettings=null;
  try{globalShellSettings=await LoomBrand.fetchSettings('../../../api')}catch{}

  const stage=document.getElementById('feature-stage');
  const waiting=document.getElementById('waitingMessage');
  const runtime=new LoomActionRuntime({project,mountRoot:stage,apiBase:'../../../api',fallbackRegistry:'../registry.fallback.json'});window.LOOM_RUNTIME=runtime;
  try{await window.LoomShell?.mountUserControls?.(document.getElementById('loomProjectUserControls'),{apiBase:'../../../api',settings:globalShellSettings||await LoomBrand.fetchSettings('../../../api'),identity:runtime.identity,project,homeHref:mountContext.homeUrl||undefined,shareMode:'slot',profileMode:'slot',reloadAfterSwitch:true})}catch(e){console.warn('LOOM project user controls unavailable',e)}
  window.loomProjectRuntime=runtime;

  async function mountProjectShellBrand(){
    const host=document.getElementById('projectShellMark');
    const nameNode=document.querySelector('[data-loom-project-name]');
    const taglineNode=document.querySelector('[data-loom-project-tagline]');
    let projectInfo=null;
    try{
      const r=await fetch(`../../../api/projects.php?project=${encodeURIComponent(project)}&clientId=${encodeURIComponent(runtime.identity.clientId)}&_=${Date.now()}`,{cache:'no-store'});
      const j=await r.json();
      projectInfo=(j.projects||[])[0]||null;
    }catch{}
    if(projectInfo?.name)nameNode.textContent=projectInfo.name;
    if(taglineNode){const tagline=String(projectInfo?.tagline||'').trim();taglineNode.textContent=tagline;taglineNode.hidden=!tagline}
    if(projectInfo?.branding?.logo_url){
      const img=document.createElement('img');
      img.src=projectInfo.branding.logo_url;
      img.alt=projectInfo.branding.logo_alt||`${projectInfo.name||'Project'} logo`;
      host.replaceChildren(img);
      return;
    }

    // Final fallback only: animated LOOM mark. Project metadata/assets are
    // intentionally checked first, independent of whether a visible Logo
    // module is installed.
    const gs=await LoomBrand.fetchSettings('../../../api');
    const bc=LoomBrand.brandConfig(gs);
    LoomBrand.mountCube(host,{size:28,path:bc.path,speed:bc.speed,animate:bc.animate});
  }

  try{
    await runtime.start();
    await mountProjectShellBrand();

    try{
      const pj=await window.LoomShell?.adminStatus?.('../../../api',runtime.identity,project);
      const canAdmin=!!pj?.isAdmin||['system-owner','loom-admin','project-admin','project-manager'].includes(pj?.projectRole);
      if(canAdmin)window.LoomShell?.mountAdminTools?.({apiBase:'../../../api',project,target:'_blank',settings:globalShellSettings||await LoomBrand.fetchSettings('../../../api'),host:adminTools,status:pj});
    }catch{}

    const hideWaiting=()=>{if(stage.children.length>1)waiting?.classList.add('modules-loaded')};
    hideWaiting();
    new MutationObserver(hideWaiting).observe(stage,{childList:true,subtree:false});
  }catch(e){
    if(waiting){waiting.textContent='LOOM could not start this project · '+e.message;waiting.classList.remove('modules-loaded')}
    console.error(e);
  }
})();
</script>
</body>
</html>
